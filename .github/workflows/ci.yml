name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Audit, format, spell, lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fails on high/critical)
        run: npm run audit

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Spell check
        run: npm run spell

      - name: Lint
        run: npm run lint

      - name: Build (includes type-check)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nativa-360-backend:ci
